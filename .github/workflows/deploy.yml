name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-dist
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: ./frontend
        run: yarn build
        env:
          CI: false
          PUBLIC_URL: ${{ github.ref_name == 'alpha' && '/portfolio/alpha' || '/portfolio' }}

      - name: Prepare Pages files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" = "alpha" ]; then
            rm -rf pages-dist/alpha pages-dist/dev
            mkdir -p pages-dist/alpha
            cp -a frontend/build/. pages-dist/alpha/
          else
            find pages-dist -mindepth 1 -maxdepth 1 \
              ! -name ".git" \
              ! -name "alpha" \
              -exec rm -rf {} +
            cp -a frontend/build/. pages-dist/
          fi

          touch pages-dist/.nojekyll

      - name: Commit Pages files
        shell: bash
        run: |
          set -euo pipefail
          cd pages-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}" || exit 0
          git push origin gh-pages
